# Experiment settings (see the report, Section 4)
data:
  path: oasis1_slices.npz      # produced by scripts/prepare_oasis1.py
  image_size: 224
  val_fraction: 0.15
  test_fraction: 0.15

seeds: [0, 1, 2, 3, 4]

training:
  batch_size: 32
  max_epochs: 30
  weight_decay: 0.0001
  early_stopping_patience: 7
  scheduler_factor: 0.5
  scheduler_patience: 3
  num_workers: 2

models:
  baseline_cnn:
    lr: 0.001
    channels: 1
  resnet18:
    lr: 0.0001
    channels: 3
    pretrained: true

augmentation:
  rotation_degrees: 10
  translate: 0.05
  hflip_p: 0.5
  intensity_scale: 0.1      # x * U(1 - s, 1 + s)
  intensity_shift: 0.1      # + U(-s, s), in standardised units

output_dir: outputs
